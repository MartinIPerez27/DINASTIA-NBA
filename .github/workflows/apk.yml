# Compila el APK de Android en cada push a main y lo publica en Releases → "Última versión".
# Descarga directa desde el celular:
#   https://github.com/MartinIPerez27/DINASTIA-NBA/releases/download/ultima/dinastia-nba.apk
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write # para crear el Release con el APK

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis y tests
        run: |
          flutter analyze
          flutter test
          python3 -m pip install --quiet nba_api
          python3 -m unittest discover tools

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dinastia-nba.apk
          gh release delete ultima --cleanup-tag --yes || true
          gh release create ultima dinastia-nba.apk \
            --title "Última versión (build ${{ github.run_number }})" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}. Descargá dinastia-nba.apk desde el celular e instalalo." \
            --target "$GITHUB_SHA" \
            --latest
