name: dinastia_nba
description: "Dinastía NBA (82-0) — draft roguelike y simulación de temporada NBA, 100% offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Persistencia local de partidas guardadas (temporadas). Cero nube.
  sqflite: ^2.4.6
  path: ^1.9.1

  # Fotos del CDN público de la NBA, guardadas en disco para jugar sin red.
  cached_network_image: ^4.0.7
  flutter_cache_manager: ^3.5.0

  # Escudos de franquicia (cdn.nba.com sirve SVG) para UI y parqué.
  flutter_svg: ^2.3.3

  # Bocina, red y tragamonedas. La háptica viene de flutter/services (sin paquete).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/database/
    - assets/logos/
    - assets/logos/historicos/
    - assets/fonts/OFL-Doto.txt
    - assets/fonts/OFL-BigShoulders.txt
  fonts:
    # Puntos LED para números y siglas (OFL).
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    # Condensada de cartelería de estadio para nombres (OFL).
    - family: BigShouldersDisplay
      fonts:
        - asset: assets/fonts/BigShouldersDisplay.ttf
